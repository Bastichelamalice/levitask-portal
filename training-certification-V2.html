<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Levitask — Training & Certification</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --black:#0a0a0a; --off-black:#111111; --surface:#161616; --surface-2:#1e1e1e;
    --border:#2a2a2a; --border-light:#333333;
    --text-primary:#f0ece4; --text-secondary:#8a8480; --text-muted:#4a4744;
    --accent:#e8622a; --accent-dim:rgba(232,98,42,0.12); --accent-glow:rgba(232,98,42,0.06);
    --green:#4a7c59; --green-bright:#6dbf86; --green-dim:rgba(74,124,89,0.15);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--black); color:var(--text-primary); font-family:'DM Sans',sans-serif; font-weight:300; min-height:100vh; display:flex; overflow-x:hidden; }

  /* ─── SIDEBAR ─────────────────────────────────────────────── */
  .sidebar { width:240px; min-height:100vh; background:var(--off-black); border-right:1px solid var(--border); display:flex; flex-direction:column; position:fixed; left:0; top:0; bottom:0; z-index:100; overflow-y:auto; }
  .sidebar::-webkit-scrollbar { width:3px; }
  .sidebar::-webkit-scrollbar-thumb { background:var(--border-light); border-radius:2px; }
  .sidebar-logo { padding:32px 28px 28px; border-bottom:1px solid var(--border); flex-shrink:0; }
  .sidebar-logo img { height:28px; filter:brightness(0) invert(1); opacity:0.9; }
  .sidebar-logo .portal-label { font-size:9px; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); margin-top:8px; font-weight:400; }
  .sidebar-nav { padding:24px 16px; flex:1; }
  .nav-section-label { font-size:9px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); padding:0 12px; margin-bottom:8px; margin-top:20px; }
  .nav-section-label:first-child { margin-top:0; }
  .nav-item { display:flex; align-items:center; gap:10px; padding:9px 12px; border-radius:6px; font-size:13px; font-weight:400; color:var(--text-secondary); cursor:pointer; transition:all 0.2s; text-decoration:none; margin-bottom:2px; }
  .nav-item:hover { background:var(--surface); color:var(--text-primary); }
  .nav-item.active { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(232,98,42,0.15); }
  .nav-icon { width:16px; height:16px; opacity:0.7; flex-shrink:0; }
  .nav-item.active .nav-icon { opacity:1; }
  .sidebar-footer { padding:20px 16px; border-top:1px solid var(--border); }
  .distributor-badge { display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--surface); border-radius:8px; border:1px solid var(--border); }
  .distributor-avatar { width:32px; height:32px; background:var(--accent-dim); border-radius:50%; border:1px solid rgba(232,98,42,0.3); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; color:var(--accent); flex-shrink:0; }
  .distributor-name { font-size:12px; font-weight:500; color:var(--text-primary); }
  .distributor-role { font-size:10px; color:var(--text-muted); margin-top:1px; }

  /* ─── MAIN ────────────────────────────────────────────────── */
  .main { margin-left:240px; flex:1; display:flex; flex-direction:column; min-height:100vh; }
  .topbar { padding:20px 40px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; background:var(--off-black); position:sticky; top:0; z-index:50; }
  .topbar-left { font-family:'Cormorant Garamond',serif; font-size:20px; font-weight:300; letter-spacing:0.02em; }
  .topbar-left span { color:var(--text-muted); font-style:italic; }
  .topbar-right { font-size:12px; color:var(--text-muted); }

  /* ─── APP CONTAINER ───────────────────────────────────────── */
  #app { flex:1; }
  @keyframes fadeUp { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
  .view-anim { animation:fadeUp 0.22s ease both; }

  /* ─── HOME VIEW ───────────────────────────────────────────── */
  .home-wrap { max-width:860px; padding:56px 64px 64px; }
  .v-eyebrow { font-size:10px; letter-spacing:0.2em; text-transform:uppercase; color:var(--accent); margin-bottom:14px; font-weight:400; }
  .v-title { font-family:'Cormorant Garamond',serif; font-size:48px; font-weight:300; line-height:1.1; margin-bottom:32px; letter-spacing:0.01em; }
  .welcome-block { border-left:3px solid var(--accent); background:var(--surface); border-radius:0 8px 8px 0; padding:20px 24px; margin-bottom:32px; }
  .welcome-block p { font-size:13px; color:var(--text-secondary); line-height:1.7; margin-bottom:12px; font-weight:300; }
  .welcome-block p:last-of-type { margin-bottom:20px; }
  .btn-primary { display:inline-flex; align-items:center; gap:8px; padding:12px 24px; background:var(--accent); color:white; border:none; border-radius:6px; font-size:13px; font-weight:400; cursor:pointer; font-family:'DM Sans',sans-serif; transition:opacity 0.2s; }
  .btn-primary:hover { opacity:0.88; }
  .btn-secondary { display:inline-flex; align-items:center; gap:8px; padding:10px 20px; background:transparent; color:var(--text-secondary); border:1px solid var(--border); border-radius:6px; font-size:13px; font-weight:400; cursor:pointer; font-family:'DM Sans',sans-serif; transition:all 0.2s; }
  .btn-secondary:hover { border-color:var(--border-light); color:var(--text-primary); }
  .progress-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:20px 24px; margin-bottom:32px; }
  .progress-block-label { font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
  .progress-bar-row { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
  .progress-bar-track { flex:1; height:4px; background:var(--border); border-radius:2px; }
  .progress-bar-fill { height:4px; background:var(--accent); border-radius:2px; transition:width 0.5s ease; }
  .progress-pct { font-size:12px; color:var(--accent); font-weight:500; white-space:nowrap; }
  .progress-detail { font-size:11px; color:var(--text-muted); margin-bottom:16px; }

  /* stepper */
  .stepper-wrap { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px 28px; margin-bottom:40px; }
  .stepper-wrap-label { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted); margin-bottom:20px; }
  .st-row { display:flex; align-items:stretch; gap:12px; }
  .st-icol { width:28px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; }
  .st-dot { width:28px; height:28px; border-radius:50%; border:1.5px solid; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .st-dot.video { background:var(--accent-dim); border-color:var(--accent); }
  .st-dot.reading { background:var(--surface-2); border-color:var(--border-light); }
  .st-con { width:1px; flex:1; min-height:8px; }
  .st-con.solid { background:var(--border); }
  .st-con.dashed { border-left:1px dashed #3a3a3a; }
  .st-text { display:flex; align-items:center; font-size:13px; color:var(--text-secondary); min-height:28px; padding-bottom:10px; }
  .st-lbl-full { font-size:9px; letter-spacing:0.14em; text-transform:uppercase; color:var(--accent); font-weight:500; padding:4px 0 8px; }
  .st-quiz-dot { width:28px; height:28px; border-radius:50%; background:var(--accent); flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  .st-quiz-dot svg { width:13px; height:13px; stroke:white; fill:none; stroke-width:2.5; }
  .st-quiz-content { flex:1; background:var(--accent-dim); border:1px solid rgba(232,98,42,0.2); border-radius:8px; padding:12px 16px; }
  .st-quiz-title { font-size:12px; font-weight:500; color:var(--accent); margin-bottom:2px; }
  .st-quiz-meta { font-size:11px; color:var(--text-secondary); }

  /* module cards */
  .section-label { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px; font-weight:400; }
  .module-card { display:flex; align-items:center; gap:16px; padding:20px 24px; background:var(--surface); border:1px solid var(--border); border-radius:10px; cursor:pointer; transition:all 0.2s; margin-bottom:8px; }
  .module-card:hover { border-color:var(--border-light); background:var(--surface-2); }
  .module-card.m-active { border-color:rgba(232,98,42,0.35); background:var(--accent-glow); }
  .module-card.m-done { border-color:rgba(74,124,89,0.35); background:var(--green-dim); }
  .module-card.m-locked { opacity:0.35; cursor:not-allowed; pointer-events:none; }
  .mc-num { width:38px; height:38px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:400; color:var(--text-muted); flex-shrink:0; font-family:'Cormorant Garamond',serif; }
  .module-card.m-active .mc-num { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
  .module-card.m-done .mc-num { border-color:var(--green); background:var(--green-dim); color:var(--green-bright); }
  .mc-info { flex:1; min-width:0; }
  .mc-name { font-size:14px; font-weight:400; color:var(--text-primary); margin-bottom:3px; }
  .mc-meta { font-size:11px; color:var(--text-muted); }
  .mc-right { display:flex; align-items:center; gap:12px; }
  .mc-badge { font-size:10px; padding:3px 9px; border-radius:3px; white-space:nowrap; }
  .mc-badge.b-locked { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
  .mc-badge.b-progress { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(232,98,42,0.2); }
  .mc-badge.b-done { background:var(--green-dim); color:var(--green-bright); border:1px solid rgba(74,124,89,0.3); }
  .mc-arrow { color:var(--text-muted); font-size:18px; opacity:0.5; }
  .module-card.m-active .mc-arrow, .module-card.m-done .mc-arrow { opacity:0.8; }

  /* cert card */
  .cert-card-home { display:flex; align-items:center; gap:16px; padding:16px 20px; background:var(--surface); border:1px solid var(--border); border-radius:10px; margin-top:24px; opacity:0.4; }
  .cert-card-home.unlocked { opacity:1; cursor:pointer; transition:all 0.2s; }
  .cert-card-home.unlocked:hover { border-color:var(--border-light); }
  .cert-star-circle { width:36px; height:36px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .cert-star-circle svg { width:16px; height:16px; stroke:var(--text-muted); fill:none; stroke-width:1.5; }
  .cert-card-home.unlocked .cert-star-circle { border-color:rgba(255,200,0,0.4); background:rgba(255,200,0,0.06); }
  .cert-card-home.unlocked .cert-star-circle svg { stroke:#f5c518; }
  .cert-home-info { flex:1; }
  .cert-home-title { font-size:13px; font-weight:400; color:var(--text-primary); margin-bottom:3px; }
  .cert-home-meta { font-size:11px; color:var(--text-muted); }

  /* ─── MODULE OVERVIEW VIEW ────────────────────────────────── */
  .mo-wrap { max-width:760px; padding:40px 48px 64px; }
  .mo-back { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); cursor:pointer; margin-bottom:28px; transition:color 0.2s; }
  .mo-back:hover { color:var(--text-secondary); }
  .mo-back svg { width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:2; }
  .mo-header { margin-bottom:32px; padding-bottom:24px; border-bottom:1px solid var(--border); }
  .mo-badge-row { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .mo-badge { font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); background:var(--accent-dim); padding:3px 10px; border-radius:3px; border:1px solid rgba(232,98,42,0.2); }
  .mo-status { font-size:11px; color:var(--text-muted); }
  .mo-status.s-progress { color:var(--accent); }
  .mo-status.s-done { color:var(--green-bright); }
  .mo-title { font-family:'Cormorant Garamond',serif; font-size:42px; font-weight:300; line-height:1.1; margin-bottom:10px; }
  .mo-lead { font-size:13px; color:var(--text-secondary); line-height:1.7; font-weight:300; max-width:580px; margin-bottom:16px; }
  .mo-meta-row { display:flex; align-items:center; gap:20px; }
  .mo-meta-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
  .mo-meta-item svg { width:13px; height:13px; stroke:currentColor; fill:none; stroke-width:1.5; opacity:0.7; }

  /* what you will learn */
  .learn-block { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:24px 28px; margin-bottom:32px; }
  .learn-label { font-size:9px; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:16px; font-weight:400; }
  .learn-cols { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
  .learn-col-title { font-size:11px; font-weight:500; color:var(--text-primary); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:10px; }
  .learn-item { display:flex; align-items:flex-start; gap:8px; font-size:12px; color:var(--text-secondary); padding:5px 0; border-bottom:1px solid var(--border); line-height:1.5; font-weight:300; }
  .learn-item:last-child { border-bottom:none; }
  .learn-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); flex-shrink:0; margin-top:6px; }

  /* section cards */
  .sc-label { font-size:10px; letter-spacing:0.18em; text-transform:uppercase; color:var(--text-muted); margin-bottom:12px; }
  .section-card { display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:8px; cursor:pointer; transition:all 0.2s; margin-bottom:8px; }
  .section-card:hover { border-color:var(--border-light); }
  .section-card.sc-active { border-color:rgba(232,98,42,0.3); }
  .section-card.sc-done { border-color:rgba(74,124,89,0.3); }
  .section-card.sc-locked { opacity:0.35; cursor:not-allowed; pointer-events:none; }
  .sc-num { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:11px; color:var(--text-muted); flex-shrink:0; }
  .section-card.sc-active .sc-num { border-color:var(--accent); background:var(--accent-dim); color:var(--accent); }
  .section-card.sc-done .sc-num { border-color:var(--green); background:var(--green-dim); color:var(--green-bright); }
  .sc-info { flex:1; }
  .sc-title { font-size:13px; font-weight:400; color:var(--text-primary); margin-bottom:5px; }
  .sc-pills { display:flex; align-items:center; gap:6px; }
  .sc-pill { font-size:9px; padding:2px 8px; border-radius:3px; letter-spacing:0.06em; }
  .pill-video { background:var(--accent-dim); color:var(--accent); border:1px solid rgba(232,98,42,0.2); }
  .pill-reading { background:var(--surface-2); color:var(--text-muted); border:1px solid var(--border); }
  .sc-time { font-size:11px; color:var(--text-muted); }
  .section-card.sc-done .sc-pill { background:var(--green-dim); color:var(--green-bright); border-color:rgba(74,124,89,0.3); }
  .sc-arrow { color:var(--text-muted); font-size:16px; opacity:0.4; }

  /* quiz card in module overview */
  .quiz-card-mo { display:flex; align-items:center; gap:14px; padding:14px 18px; background:var(--surface); border:1px solid var(--border); border-radius:8px; margin-top:4px; opacity:0.4; }
  .quiz-card-mo.unlocked { opacity:1; cursor:pointer; transition:all 0.2s; border-color:rgba(232,98,42,0.2); background:var(--accent-glow); }
  .quiz-card-mo.unlocked:hover { border-color:rgba(232,98,42,0.4); }
  .qc-icon { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .quiz-card-mo.unlocked .qc-icon { border-color:var(--accent); background:var(--accent-dim); }
  .qc-icon svg { width:14px; height:14px; stroke:var(--text-muted); fill:none; stroke-width:2; }
  .quiz-card-mo.unlocked .qc-icon svg { stroke:var(--accent); }
  .qc-info { flex:1; }
  .qc-title { font-size:13px; font-weight:400; color:var(--text-primary); margin-bottom:3px; }
  .qc-meta { font-size:11px; color:var(--text-muted); }
  .quiz-card-mo.unlocked .qc-meta { color:var(--text-secondary); }

  /* module overview bottom bar */
  .mo-bottom { display:flex; align-items:center; justify-content:space-between; padding:24px 0; margin-top:24px; border-top:1px solid var(--border); }

  /* ─── QUIZ VIEW ───────────────────────────────────────────── */
  .quiz-wrap { max-width:760px; padding:48px 64px 64px; }
  .quiz-header { margin-bottom:28px; padding-bottom:24px; border-bottom:1px solid var(--border); }
  .quiz-title { font-family:'Cormorant Garamond',serif; font-size:36px; font-weight:300; line-height:1.1; margin:12px 0 10px; }
  .quiz-desc { font-size:13px; color:var(--text-secondary); line-height:1.6; font-weight:300; margin-bottom:16px; }
  .quiz-rules { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .quiz-rule { font-size:11px; color:var(--text-muted); background:var(--surface); border:1px solid var(--border); border-radius:3px; padding:4px 10px; }
  .q-dots-row { display:flex; align-items:center; margin-bottom:28px; }
  .q-dot { width:32px; height:32px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:400; color:var(--text-muted); flex-shrink:0; transition:all 0.2s; background:var(--surface); }
  .q-dot.q-active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .q-dot.q-correct { border-color:var(--green); color:var(--green-bright); background:var(--green-dim); }
  .q-dot.q-wrong { border-color:#c0392b; color:#e57373; background:rgba(192,57,43,0.1); }
  .q-connector { flex:1; height:1px; background:var(--border); min-width:12px; max-width:32px; }
  .question-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:28px; margin-bottom:20px; }
  .q-label { font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--text-muted); margin-bottom:14px; }
  .q-text { font-size:16px; font-weight:400; color:var(--text-primary); line-height:1.5; margin-bottom:22px; }
  .options { display:flex; flex-direction:column; gap:8px; margin-bottom:24px; }
  .option { display:flex; align-items:center; gap:14px; padding:13px 16px; background:var(--surface-2); border:1.5px solid var(--border); border-radius:8px; cursor:pointer; transition:all 0.15s; user-select:none; }
  .option:hover { border-color:var(--border-light); }
  .option.opt-selected { border-color:var(--accent); background:var(--accent-glow); }
  .option.opt-correct { border-color:var(--green); background:var(--green-dim); cursor:default; }
  .option.opt-wrong { border-color:#c0392b; background:rgba(192,57,43,0.08); cursor:default; }
  .opt-letter { width:26px; height:26px; border-radius:50%; border:1.5px solid var(--border-light); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:500; color:var(--text-muted); flex-shrink:0; }
  .option.opt-selected .opt-letter { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }
  .option.opt-correct .opt-letter { border-color:var(--green); color:var(--green-bright); background:var(--green-dim); }
  .option.opt-wrong .opt-letter { border-color:#c0392b; color:#e57373; background:rgba(192,57,43,0.12); }
  .opt-text { font-size:13px; color:var(--text-secondary); line-height:1.4; font-weight:300; }
  .option.opt-correct .opt-text { color:var(--text-primary); }
  .quiz-actions { display:flex; justify-content:flex-end; }
  .btn-primary:disabled { opacity:0.4; cursor:not-allowed; }
  .quiz-result { border-radius:10px; padding:28px 32px; margin-bottom:28px; display:flex; align-items:center; gap:24px; }
  .quiz-result.pass { background:var(--green-dim); border:1px solid rgba(74,124,89,0.35); }
  .quiz-result.fail { background:rgba(192,57,43,0.06); border:1px solid rgba(192,57,43,0.25); }
  .result-icon { width:52px; height:52px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .quiz-result.pass .result-icon { background:rgba(74,124,89,0.2); border:1.5px solid rgba(74,124,89,0.4); }
  .quiz-result.fail .result-icon { background:rgba(192,57,43,0.12); border:1.5px solid rgba(192,57,43,0.3); }
  .result-icon svg { width:22px; height:22px; }
  .result-info { flex:1; }
  .result-title { font-family:'Cormorant Garamond',serif; font-size:24px; font-weight:300; margin-bottom:4px; }
  .quiz-result.pass .result-title { color:var(--green-bright); }
  .quiz-result.fail .result-title { color:#e57373; }
  .result-score { font-size:13px; font-weight:400; margin-bottom:4px; }
  .quiz-result.pass .result-score { color:var(--text-primary); }
  .quiz-result.fail .result-score { color:var(--text-secondary); }

        id: 1, title: "Ordering, Production & Logistics", time: "~7 min",
        lead: "How production is triggered, what timelines to communicate, and how to manage delivery expectations without overpromising.",
        textOnly: true,
        content: `
          <div class="content-section">
            <h3 class="content-h3">When Production Starts</h3>
            <p class="content-p">Production begins upon receipt of the initial deposit and agreed production timelines. It is not triggered by an enquiry, a Proforma Invoice, or a signed purchase order alone. This distinction matters: distributors who count lead time from the first enquiry will systematically over-promise delivery dates.</p>
            <div class="callout"><p>Lead times start from confirmed production. If a distributor commits a customer delivery date before a production slot is confirmed, that commitment has no foundation.</p></div>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Production Cycle</h3>
            <p class="content-p">The standard production cycle is 50 days. This applies to both first orders and repeat orders unless Levitask has confirmed an expedited arrangement. There is no shorter "repeat order" cycle by default.</p>
            <div class="card-grid">
              <div class="content-card accent"><div class="card-h">First Orders</div><div class="card-p">50-day production cycle from confirmed deposit and agreed timelines.</div></div>
              <div class="content-card accent"><div class="card-h">Repeat Orders</div><div class="card-p">Same 50-day cycle unless an expedited arrangement is confirmed with Levitask in advance.</div></div>
            </div>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Calculating Total Delivery Time</h3>
            <p class="content-p">Total delivery time is not just production. It is: production lead time, plus sea freight transit time, plus allowance for customs clearance, port congestion, public holidays, and other real-world delays at origin and destination. The 50-day production cycle and any sea freight estimate are starting points, not fixed commitments.</p>
            <p class="content-p">Never quote a delivery date to a customer using only the production figure. Build in transit and buffer — then communicate clearly that these are working estimates.</p>
            <div class="card-grid">
              <div class="content-card"><div class="card-h">Sea Freight Estimates</div><div class="card-p">Carrier routing, port congestion, customs, and final destination all affect actual transit time. Treat published estimates as guidance only.</div></div>
              <div class="content-card"><div class="card-h">Risk Transfer</div><div class="card-p">Risk transfer timing is determined by the Incoterms in the distributor agreement. Do not improvise legal terms — refer to the agreement document.</div></div>
              <div class="content-card"><div class="card-h">Transit Damage</div><div class="card-p">Report any possible transit damage to Levitask immediately upon delivery. Delayed reporting can affect resolution and liability.</div></div>
            </div>
          </div>`
      },
      {
        id: 2, title: "Returns & Exchanges", time: "~7 min",
        lead: "The minimum D2C return standard, how exchanges work, and what B2B return terms look like.",
        textOnly: true,
        content: `
          <div class="content-section">
            <h3 class="content-h3">The D2C Return Standard</h3>
            <p class="content-p">Authorised distributors must offer a minimum 30-day return window from delivery for direct-to-consumer customers. Four conditions apply without exception:</p>
            <div class="card-grid">
              <div class="content-card accent"><div class="card-h">30 days from delivery</div><div class="card-p">Window starts from delivery date, not order date. Communicate this clearly at point of sale.</div></div>
              <div class="content-card accent"><div class="card-h">Like-new condition</div><div class="card-p">No damage, no modifications, no permanent marks. Minor castor marks from normal use are acceptable.</div></div>
              <div class="content-card accent"><div class="card-h">Original retail box</div><div class="card-p">All accessories must be included. Significant box damage or missing components are grounds to refuse.</div></div>
              <div class="content-card accent"><div class="card-h">Customer pays return shipping</div><div class="card-p">This is the distributor minimum standard. Levitask does not absorb return freight costs at this level.</div></div>
            </div>
            <div class="callout"><p>This is not a free-damage policy. Communicate the condition requirements clearly at point of sale — a customer who misunderstands the policy creates preventable disputes.</p></div>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Refund Timing</h3>
            <p class="content-p">Refunds are processed within 5-10 business days of receiving and inspecting the returned unit. The clock starts from inspection — not from the customer's return request date. Tell customers this upfront so the expectation is set before any dispute arises.</p>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Exchanges and Variants</h3>
            <p class="content-p">There is no formal exchange programme. A customer who wants a different model or variant returns their unit for a full refund through the standard process, then places a new order separately. Do not swap units informally — the return and re-purchase process exists to keep inventory records clean.</p>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Inspection Protocol and B2B Returns</h3>
            <div class="card-grid">
              <div class="content-card"><div class="card-h">Inspect before refunding</div><div class="card-p">Photograph the returned parcel before opening. Inspect the box, all components, accessories, and the unit itself. Retain photos for at least 12 months.</div></div>
              <div class="content-card"><div class="card-h">Returns to refuse</div><div class="card-p">Visible damage, permanent marks, unauthorised modifications, significant box damage, or missing contents. Document the refusal with photos.</div></div>
              <div class="content-card"><div class="card-h">B2B returns</div><div class="card-p">Business buyer returns are handled case by case under the distributor-buyer agreement. Defective units follow the warranty process, not the standard return policy.</div></div>
            </div>
          </div>`

        id: 3, title: "Warranty & After-Sales", time: "~6 min",
        lead: "Warranty coverage periods, how claims are processed, how spare units work, and how to handle unresolved specification questions.",
        textOnly: true,
        content: `
          <div class="content-section">
            <h3 class="content-h3">Warranty Coverage</h3>
            <p class="content-p">The Vision Chair carries a split warranty. Know these numbers precisely — procurement teams in B2B conversations will ask for exact figures, and an approximate answer signals that the distributor has not done the work.</p>
            <div class="card-grid">
              <div class="content-card accent"><div class="card-h">10 years</div><div class="card-p">Structural components, mechanism, base, castors, backrest, and headrest.</div></div>
              <div class="content-card accent"><div class="card-h">5 years</div><div class="card-p">Upholstery and fabric.</div></div>
            </div>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">What the Warranty Does Not Cover</h3>
            <p class="content-p">The warranty does not cover damage from misuse, accident, unauthorised modification, negligence, or normal wear and tear. It also does not cover damage that occurs after the agreed risk transfer point. This is standard — Levitask's warranty support is strong, but it is not open-ended.</p>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">How Claims Are Handled</h3>
            <p class="content-p">When a warranty claim affects a single defective component, the standard approach is component-level replacement. Levitask ships a pre-packaged replacement component directly to the end customer after authorisation. The customer installs it and disposes of the defective part. This is more efficient than full-unit replacement and lets one spare unit support multiple separate claims.</p>
            <div class="callout"><p>Before deploying any spare unit or removing any component: notify Levitask at warranty@levitask.com with photos of the defect, wait for authorisation, and track each component used. Do not deploy first and report later.</p></div>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Spare Unit Programme</h3>
            <p class="content-p">Orders of 100 units or more receive a complimentary spare allocation equal to 4% of total units ordered. This allocation is designed to cover component-level warranty claims. Confirm eligibility and the specific allocation with Levitask before planning after-sales capacity — do not promise spare unit availability before it is confirmed.</p>
          </div>
          <div class="content-divider"></div>
          <div class="content-section">
            <h3 class="content-h3">Handling Unresolved Specifications</h3>
            <p class="content-p">Some details — including aluminum surface treatment and backrest recline lock functionality — may still be pending final confirmation through testing and supplier decisions. If a customer asks, explain that these details are being finalised and that the distributor will refer to the latest official technical sheet once it is released. Do not guess, estimate, or commit to pending specifications. Direct them to the current spec sheet for confirmed details.</p>
          </div>`
      }
    ]

    { q: "A buyer says the chair is expensive. Which product-mastery answer is strongest?", opts: ["The price reflects the innovation and premium positioning, so it should not be compared directly.", "Look at the cost over its useful life and the longer warranty, not only the upfront price.", "Lead with the lower-priced model first, then discuss the higher configuration if needed.", "Use the Kickstarter result and award recognition before discussing cost of ownership."], _c: "MQ==", _e: _b("Total cost of ownership is more persuasive than defending price.") },
    { q: "Which certification and sustainability statement is most accurate today?", opts: ["The Vision Chair can be presented as certified because the production facility holds ISO 14001, amfori BSCI, and Sedex.", "Levitask is developing product-level carbon offsetting for Vision Chair production and working toward plastic neutrality; ISO 14001:2015, amfori BSCI, and Sedex apply to the manufacturing facility's operations, not to the Vision Chair as product-specific certifications.", "The sustainability story should focus only on product longevity until product-level work is fully finalized.", "Facility certifications and product-level sustainability work can be grouped together as one procurement claim."], _c: "MQ==", _e: _b("Distributors must separate product-level sustainability work from facility-level operating certifications.") },
    { q: "A customer assumes Vision X is automatically \"better\" because it costs more. What should the distributor say?", opts: ["Vision X is the better choice whenever the buyer wants the strongest version of the chair.", "Both models deliver the same core posture benefit; Vision X adds headrest and taller-backrest features for users who need them.", "Vision Y is best positioned as the simpler version for buyers who are not ready for the full product.", "The main difference is price; posture and support should be treated as the same conversation."], _c: "MQ==", _e: _b("This preserves trust and helps the buyer choose fit over hierarchy.") },
    { q: "What is the distributor's goal during product setup?", opts: ["Guide the setup smoothly while keeping most of the explanation for after the demo.", "Find the position that feels natural to the individual user and ask how it feels as adjustments are made.", "Use a consistent setup for every customer so the comparison stays objective.", "Show all adjustment ranges in detail so the customer sees how much engineering is built in."], _c: "MQ==", _e: _b("The chair must be experienced as personally fitted.") }
  ],
  3: [
    { q: "How should distributors explain the adaptation period for the Vision Chair?", opts: ["There is no adaptation period.", "Adaptation can take anywhere from about 3 days to 2 weeks depending on the individual, so users should increase the use of elevated angle gradually and let the body adjust.", "The adaptation period is usually one week.", "Adaptation applies only to customers with existing back discomfort; most other users do not need a transition period."], _c: "MQ==", _e: _b("Distributors should set realistic expectations: the seating difference can be felt quickly, but full adaptation varies by person.") },
    { q: "A prospect asks, \"Will this cure my back pain?\" What is the best response?", opts: ["Yes, the chair is guaranteed to cure any back pain.", "We cannot promise medical outcomes, but many users report improvement, so it is reasonable to expect meaningful relief.", "The chair is not a treatment, so back pain should be discussed only with a doctor.", "The chair is guaranteed to cure back pain over a long period of time."], _c: "MQ==", _e: _b("This is honest, legally safer, and still explains the value.") },
    { q: "What is the main limitation of traditional lumbar support?", opts: ["It can support the lower back for only a short period, as it does not fix the seating angle that causes the pelvis to rotate backward over time.", "It works mainly by making the chair softer, so it loses value once the user adapts to the cushion.", "It works only when the user is reclined, so it does not help during active work.", "It improves seat stability, but it does not help the lower back during long work sessions."], _c: "MA==", _e: _b("Lumbar support may give temporary relief, but it is still downstream; Elevated Seating addresses the upstream seating angle and pelvic position.") },
    { q: "What does the phrase \"the geometry does the work\" mean?", opts: ["The changed seating angle helps the pelvis rotate forward and supports a better posture without constant conscious effort.", "The mechanism creates the posture effect only after the user learns the correct setup.", "The chair encourages posture by making slouching less comfortable.", "The backrest holds the spine in place so the user does not have to think about posture."], _c: "MA==", _e: _b("This is the simple, non-clinical way to explain the principle.") },
    { q: "What should distributors say if a customer wants deeper proof?", opts: ["The research is mainly historical, so the best proof is the live demo.", "The principle is supported by research going back decades, and the detailed resources can be shared if they want to go deeper.", "The key studies are available, but most customers should not need them before trying the chair.", "The science is already established, so deeper proof is rarely necessary."], _c: "MQ==", _e: _b("The distributor can be credible without overwhelming the buyer.") },
    { q: "Which claim should distributors avoid?", opts: ["The research supports the principle strongly enough to use as a primary sales claim.", "The chair changes the seating angle and encourages forward pelvic rotation.", "The chair is designed to solve any back pain.", "Many customers notice a different seated feeling during the demo."], _c: "Mg==", _e: _b("Cure language is too medical and too absolute.") },
    { q: "How should the adaptation period be explained?", opts: ["\"If it feels different at first, it may be because your body is adapting; start gradually and increase use over time.\"", "\"If it feels different at first, reduce the T-Mech angle and keep the setup closer to neutral.\"", "\"Use it normally from day one so the body learns the new posture faster.\"", "\"If the user does not feel immediate comfort, the gas lift or model choice is probably wrong.\""], _c: "MA==", _e: _b("The training includes gradual adaptation as a practical customer expectation.") },
    { q: "What expectation should a distributor set for the customer's first days with the Vision Chair?", opts: ["The customer may feel the seating difference quickly, but the body can need several days to two weeks to fully adapt depending on the individual.", "The customer should expect the chair to feel completely natural immediately if the setup is correct.", "The customer should avoid using the chair for full workdays until the two-week mark has passed.", "The customer should judge the chair mainly by whether it removes discomfort in the first sitting session."], _c: "MA==", _e: _b("Clear expectation-setting prevents customers from confusing a new posture experience with a product problem.") },
    { q: "A customer says the chair still feels unusual after the first few days. What should the distributor do?", opts: ["Check the setup, remind them that adaptation can take from about 3 days to 2 weeks depending on the person, and encourage gradual use.", "Tell them the chair is probably not suitable for their body type if it still feels different after several days.", "Recommend lowering the T-Mech completely and using the chair like a conventional ergonomic chair.", "Explain that the chair should feel unusual because discomfort proves the posture is changing."], _c: "MA==", _e: _b("Distributors should treat early adjustment as a normal onboarding issue: check fit, set expectations, and avoid making the customer feel something is wrong.") },
    { q: "A skeptical buyer says, \"This sounds too scientific.\" What should the distributor do?", opts: ["Use one research reference to show that the science is credible, then return to the product.", "Translate the idea into a simple everyday outcome and offer the demo.", "Move quickly into the demo and avoid discussing science unless the buyer asks again.", "Reframe the product as a comfort solution instead of a posture principle."], _c: "MQ==", _e: _b("Distributors should make the science usable, not intimidating.") },
    { q: "Which statement is most helpful when explaining why the chair may feel different at first?", opts: ["\"Because the chair changes your seating angle, your body may need a few days to two weeks to adapt to the new position.\"", "\"If the chair feels different at first, it usually means the setup is wrong and needs to be lowered.\"", "\"The different feeling is mainly caused by the lumbar support working harder than in a normal chair.\"", "\"Most customers should ignore the first few days because the chair cannot be judged until the body fully adapts.\""], _c: "MA==", _e: _b("The distributor should normalize the adaptation period while still keeping the explanation simple and customer-ready.") },
    { q: "How should the distributor use the six health benefits in conversation?", opts: ["As six possible entry points depending on the customer.", "As a menu of talking points to cover once the customer shows interest.", "As evidence that the chair can address most common sitting-related problems.", "As a way to decide which model and configuration is right for the customer."], _c: "MA==", _e: _b("The benefits are tools for relevance.") },
    { q: "A customer asks why a normal ergonomic chair with a backrest is not enough. What is the best answer?", opts: ["It can be enough for support, but it does not create the same seating-angle change.", "Backrests can support you in a 90-degree setup, but they do not change the seating angle that affects pelvic rotation.", "Backrests are helpful, but the seat surface and desk height matter more.", "The Vision Chair solves this by using less backrest pressure and more active sitting."], _c: "MQ==", _e: _b("This explains the category difference without attacking other chairs.") },
    { q: "A buyer asks, \"Is this just a new trend, or is there real thinking behind it?\" What should the distributor do?", opts: ["Briefly explain that the principle is supported by a long history of posture research, then bring the conversation back to what the customer can feel in the demo.", "Walk the buyer through the full research timeline before allowing them to sit in the chair.", "Say the research proves the chair will work for most users, then use the demo as confirmation.", "Avoid discussing research unless the buyer is a clinician or technical decision-maker."], _c: "MA==", _e: _b("Research should create credibility without turning the sales conversation into a lecture; the demo is still what makes the idea real.") }
  ],
  4: [
    { q: "What is the most common positioning mistake?", opts: ["Framing the Vision Chair as a better ergonomic chair.", "Opening with the mechanism before explaining why the category is different.", "Starting with the demo before the buyer understands what they should notice.", "Avoiding direct competitor criticism, which can make the pitch less forceful."], _c: "MA==", _e: _b("The wrong frame turns the sale into a feature comparison.") },
    { q: "How should a distributor respond when a customer mentions a specific premium chair brand?", opts: ["Contrast the brand directly against Levitask so the customer understands the limitation.", "Say it is a premium chair, but explain that premium does not necessarily mean better posture.", "Acknowledge it as a strong chair within the 90-degree paradigm, then explain how Levitask steps outside that paradigm.", "Move the conversation to price and warranty because brand comparisons are hard to win."], _c: "Mg==", _e: _b("Respectful reframing is more credible than competitor criticism.") },
    { q: "What is the core limitation of traditional ergonomic chairs in the training?", opts: ["They support the back but do not usually guide the pelvis into the same position.", "They optimize comfort and support within the 90-degree paradigm but do not change the seating angle that allows for natural posture while seated.", "They focus mainly on adjustability, which can make setup harder for customers.", "They are strong products, but the category has become too familiar to feel innovative."], _c: "MQ==", _e: _b("This is the main competitive distinction.") },
    { q: "What do saddle and kneeling chairs generally get right?", opts: ["They understand that changing the seating angle can encourage forward pelvic rotation.", "They show that users can accept a different seated posture in certain work settings.", "They demonstrate that back support can be removed if the pelvis is positioned correctly.", "They help explain why some buyers already understand the value of posture-first seating."], _c: "MA==", _e: _b("The training encourages nuanced, non-dismissive comparison.") },
    { q: "What is the main practical limitation of saddle and kneeling chairs?", opts: ["They often make the posture concept look too unusual for conservative office buyers.", "They often rely on knee/shin support and usually sacrifice full back support, recline, or long-session office practicality.", "They create a different seating angle but usually solve stability through the knees or shins.", "They can be effective for posture, but they are usually positioned more as task chairs than premium office chairs."], _c: "MQ==", _e: _b("The Vision Chair delivers the pelvic-rotation logic without knee stoppers, while keeping full-support usability.") },
    { q: "How should gaming chairs be positioned in comparison?", opts: ["They often add padding and visual comfort while staying inside the 90-degree sitting premise.", "They can be comfortable, but they usually solve posture through padding and recline rather than seating angle.", "They are useful for comparison because they also target long sitting sessions and comfort.", "They compete mostly on visual identity, which is different from Levitask but still relevant to buyers."], _c: "MA==", _e: _b("The comparison should focus on principle, not mockery.") },
    { q: "Why are balance stools and stability balls limited in B2B settings?", opts: ["They activate the body, but that activation can become tiring during long desk work.", "They can be fatiguing, unsupported, and often do not fit professional environments.", "They support movement, but they usually do not provide the same professional office-chair format.", "They are useful in wellness settings but harder to standardize across teams."], _c: "MQ==", _e: _b("Corporate buyers need practical daily-use solutions.") },
    { q: "What combination makes the Vision Chair distinctive in the market landscape?", opts: ["Changed seating angle, forward pelvic rotation logic, full back support, recline, and professional aesthetics.", "Good looking design and a premium wellness aesthetic.", "Forward pelvic rotation, knee support, no backrest, and a simpler office format.", "Premium cushioning, recognizable styling, advanced recline, and a strong warranty."], _c: "MA==", _e: _b("This is the product-category gap Levitask fills.") },
    { q: "A customer already owns a premium ergonomic chair. How should the distributor frame the conversation?", opts: ["Treat it as a positive signal: the customer already values seating, so the conversation should move toward long-term investment in wellness, performance, and the different seating principle behind Vision Chair.", "Focus first on proving that the Vision Chair has better materials and a stronger warranty than the chair they already own.", "Position Vision Chair as the next premium upgrade within the same ergonomic chair category.", "Avoid challenging their current chair, because premium-chair owners are unlikely to reconsider seating."], _c: "MA==", _e: _b("Premium-chair ownership shows the customer already invests in seating; the distributor should elevate the conversation to category difference and long-term value.") },
    { q: "Which line best summarizes the competitive frame?", opts: ["We compete by delivering a more complete premium ergonomic feature set.", "We are not competing against a brand; we are competing against the 90-degree assumption.", "We compete against premium chairs by showing a better posture outcome at a similar price.", "We compete by comparing the Vision Chair directly against the best-known brands."], _c: "MQ==", _e: _b("The distributor should sell a different premise.") },
    { q: "Why can the Vision Chair fit into a broader corporate wellness conversation?", opts: ["Companies are paying more attention to workplace health, absenteeism, employee performance, ESG reporting, and talent retention, so seating can be discussed as part of a wider people investment.", "Corporate buyers are mainly looking for cheaper ways to replace standing desks, so the chair should be positioned as a budget alternative.", "Facilities teams now make all furniture decisions independently, so distributors should avoid HR and leadership conversations.", "Remote work has reduced the importance of office furniture, so the strongest corporate angle is storage efficiency."], _c: "MA==", _e: _b("Distributors should connect Vision Chair to real B2B priorities, not treat it as only another furniture SKU.") },
    { q: "How should the Vision Chair be discussed with height-adjustable desks?", opts: ["As a strong combination because the user's working position rises when the chair is elevated.", "As useful but secondary, because the chair should be sold independently first.", "As a potential add-on only after the buyer has already decided on the chair.", "As a setup consideration that matters mostly for taller users and shared workstations."], _c: "MA==", _e: _b("The chair plus height-adjustable desk can improve fit and create a larger opportunity.") },
    { q: "If a customer only has a fixed-height desk, what is the best approach?", opts: ["Lead with the chair first and discuss the desk only if the buyer notices an issue.", "Be upfront that the chair can work, but the experience is best optimized with the right desk height.", "Recommend the short gas lift first so the chair works better with a fixed-height desk.", "Position the height-adjustable desk as optional unless the customer is buying for a team."], _c: "MQ==", _e: _b("Clear expectation-setting prevents poor fit.") },
    { q: "Why does standing-desk adoption support the market opportunity for the Vision Chair?", opts: ["It shows that companies and individuals already understand posture matters; the Vision Chair extends that logic to the seated part of the workday.", "It shows that buyers prefer standing over sitting, so distributors should position the Vision Chair as a replacement for standing desks.", "It shows that height-adjustable desks have solved most posture problems, so the chair should be sold mainly as a comfort upgrade.", "It shows that corporate buyers care more about desk equipment than seating, so the chair should be introduced only after desk decisions are made."], _c: "MA==", _e: _b("Standing desks validate the broader posture and workplace-wellness trend; Levitask wins by addressing the hours people still spend seated.") },
    { q: "How should a distributor describe ISO 14001:2015, amfori BSCI, and Sedex accurately?", opts: ["They apply to the manufacturing facility's operations and can support procurement conversations, but they should not be described as product-specific Vision Chair certifications.", "They certify the Vision Chair itself because the chair is produced inside a facility that holds those standards.", "They should be avoided in sales conversations because facility-level certifications are not useful to corporate buyers.", "They prove both manufacturing responsibility and the chair's ergonomic benefit, so they can support both sustainability and wellness claims."], _c: "MA==", _e: _b("Facility-level certifications are valuable, but distributors must keep the distinction clear to protect credibility.") },
    { q: "Why did remote work create a stronger market for wellness furniture?", opts: ["People became more aware of home-office chairs, but usually continued treating them as short-term purchases.", "Many people began feeling the consequences of long home-office sitting and started investing in better setups.", "Companies started reimbursing home-office setups, making the chair mostly an HR reimbursement product.", "Premium home-office buyers began treating seating as a style purchase rather than a posture investment."], _c: "MQ==", _e: _b("Remote work created motivated buyers outside traditional offices.") },
    { q: "What are Levitask's three structural advantages from the training?", opts: ["Patent-pending technology, premium materials, and a strong warranty story.", "Patent-pending functional technology, 40 years of engineering knowledge, and proven early market demand.", "Kickstarter validation, NeoCon recognition, and distributor network.", "New category positioning, product quality, and early adopter testimonials."], _c: "MQ==", _e: _b("These are the defensibility points serious distributors need.") },
    { q: "What does the patent-pending T-Mech protection mean in practical sales language?", opts: ["It helps explain why Levitask has a stronger mechanism story than visual-copy competitors.", "It protects the functional knee-pivot approach that solves sliding, not merely the cosmetic look.", "It means competitors can still make forward-tilt chairs but cannot market them as Elevated Seating.", "It should be framed carefully as patent-pending protection, not as completed global exclusivity."], _c: "Mw==", _e: _b("The point is functional defensibility without overstating legal status.") },
    { q: "How should Kickstarter validation be used?", opts: ["As proof of real early demand and category interest.", "As proof that most future customers will understand the concept before trying the chair.", "As a reason to lead with crowdfunding success before the product mechanism.", "As evidence that market demand is already strong enough to reduce distributor education."], _c: "MA==", _e: _b("It supports market credibility, not individual performance claims.") },
    { q: "What is the opportunity for early distributors?", opts: ["Build expertise and relationships before the category becomes widely understood.", "Use the early window to sell quickly before the category requires deeper education.", "Wait until the category becomes easier to explain, then scale faster with less effort.", "Focus on price and availability before larger brands enter the category."], _c: "MA==", _e: _b("Category creation rewards early credible operators.") }
  ],
  5: [
    { q: "What should the knee-pivot demonstration prove?", opts: ["That the forward tilt comes from a controlled mechanism rather than a loose seat pan.", "That the thighs stay in contact while the seat tilts and reclines, answering the sliding concern.", "That the user can recline while the chair keeps a more open working posture.", "That the Anti-Slip Matrix is supported by the movement path, not only by surface grip."], _c: "MQ==", _e: _b("This is the most important technical moment in the demo.") },
    { q: "What is the right approach to adjustments during a distributor demo?", opts: ["Keep it simple: fit the chair enough for the customer to feel right, adjust the seat depth and backrest height/depth to where it feels right, and avoid turning the demo into a technical walkthrough of every control.", "Explain every adjustment before the customer sits down so they understand the product fully.", "Focus almost entirely on the T-Mech lever because the other adjustments are secondary to the category story.", "Let the customer explore every adjustment alone so the distributor does not influence their first impression."], _c: "MA==", _e: _b("The demo should make the chair feel intuitive and easy; too much adjustment detail can make the product feel more complicated than it is.") },
    { q: "What should distributors explain about desk height when demonstrating or selling the Vision Chair?", opts: ["For the best demo and long-term setup, the work surface should match the elevated seating position; a height-adjustable desk is ideal, but alternatives such as table risers can also work.", "A height-adjustable desk is mandatory before a customer can properly try the chair, and fixed desks should be avoided entirely.", "Desk height should be discussed only after purchase because it can make the demo feel too technical.", "Table risers should be presented as the preferred solution because they are simpler than height-adjustable desks."], _c: "MA==", _e: _b("The chair works best when the workstation height matches the elevated seating position; distributors should make this clear without making the demo feel blocked or overcomplicated.") },
    { q: "What should be the main goal of the Vision Chair demo?", opts: ["Help the customer feel the difference in a simple, properly fitted working position, then connect that feeling back to the seating-angle story.", "Teach the customer every adjustment so they can operate the chair independently before discussing the seating principle.", "Prove that the Vision Chair has more features than a conventional premium ergonomic chair.", "Move quickly from the first sitting experience into model choice, pricing, and delivery timing."], _c: "MA==", _e: _b("The demo should make the chair feel intuitive and meaningful; it should not become a long technical walkthrough or a feature comparison.") },
    { q: "If the customer sits down and the chair does not immediately feel right, what should the distributor do first?", opts: ["Recheck the basic fit: seat depth, backrest height, chair height, and desk or arm-pad alignment before judging the product.", "Increase the T-Mech elevation so the customer feels a stronger difference.", "Explain the mechanism in more detail so the customer understands what they should be feeling.", "Tell the customer that it may take up to two weeks before the chair feels right."], _c: "MA==", _e: _b("A poor setup can make the chair feel wrong; the distributor should solve fit first before explaining, selling, or assuming it is only an adaptation issue.") },
    { q: "How much mechanism explanation should the distributor give during the demo?", opts: ["Enough to make the experience understandable, but not so much that the customer stops focusing on how the chair feels.", "A full technical explanation before the customer sits, so the experience has context.", "As little as possible, because the customer should judge the chair only by comfort.", "A detailed comparison against saddle chairs, kneeling chairs, and premium ergonomic chairs before discussing fit."], _c: "MA==", _e: _b("The distributor should translate the mechanism into a clear experience, not turn the demo into a lecture.") },
    { q: "If a customer gives a lukewarm reaction after trying the chair, what should the distributor do next?", opts: ["Ask a simple fit or setup question, such as whether the seat depth, backrest height, desk height, or elevated position feels right.", "Move into the closing question because the customer has already experienced the product.", "Explain the science again so the customer understands why the chair should feel different.", "Assume the customer is not a fit and switch the conversation to warranty, price, or delivery."], _c: "MA==", _e: _b("A weak reaction may come from setup or fit, not from lack of interest; the distributor should diagnose before selling harder.") },
    { q: "After a corporate buyer understands the chair, what is the most useful next step to explore?", opts: ["Which team, role, or workspace would be the best place to test or pilot the chair first.", "Whether the buyer personally prefers Vision X or Vision Y.", "Whether procurement wants the technical specification sheet before anyone else tries it.", "Whether the buyer is ready to discuss delivery timing and payment terms."], _c: "MA==", _e: _b("Corporate sales usually move through a practical use case or pilot; the distributor should help the buyer identify where the chair can prove value first.") },
    { q: "Which showroom setup is most aligned with the training?", opts: ["Vision Chair near a height-adjustable desk, with a conventional chair available only if the customer asks to compare.", "Vision Chair near a height-adjustable desk, with a conventional chair nearby for contrast, and the chair pre-set at elevation.", "Vision Chair beside product spec sheets, with enough space for the customer to move around it.", "Vision X and Vision Y side by side, with the demo focused first on model comparison."], _c: "MQ==", _e: _b("The physical environment should create curiosity and contrast.") },
    { q: "A prospect says, \"It is too expensive.\" What should the distributor do?", opts: ["Acknowledge the concern and move quickly into the lower-priced Vision Y option.", "Reframe from upfront price to cost per day, lifespan, total cost of ownership, and value.", "Anchor the price against premium ergonomic chairs before explaining the mechanism.", "Offer financing or volume discount options once the buyer has understood the value."], _c: "MQ==", _e: _b("The price objection is usually about perceived value.") },
    { q: "A prospect says, \"I already have an ergonomic chair.\" What is the best response?", opts: ["\"That makes sense; this is mainly for people who are unhappy with their current ergonomic chair.\"", "\"Traditional ergonomic chairs optimize 90-degree sitting; Levitask changes the category by eliminating that premise.\"", "\"Your current chair may be excellent, so the main difference is whether the Vision Chair feels more comfortable.\"", "\"Then the best next step is to compare warranties, materials, and price before discussing posture.\""], _c: "MQ==", _e: _b("The response should respect the current chair while reframing the problem.") },
    { q: "A B2B buyer says, \"I need approval from my manager or CFO.\" What should the distributor do?", opts: ["Ask what information the manager or CFO will need and send the full training deck.", "Offer to prepare a concise ROI summary that helps the buyer make the internal case.", "Ask whether the buyer can approve a small pilot before involving finance.", "Shift the conversation to product experience and avoid ROI until procurement asks."], _c: "MQ==", _e: _b("The objection is an opportunity to support the internal buying process.") },
    { q: "A prospect asks, \"Is this just a fad?\" What is the strongest answer?", opts: ["The product is new, but the problem it addresses is very old.", "The product is new, but the seating principle is backed by decades of research; the engineering breakthrough is what finally made it practical.", "The category is early, which is why buyers can still be first movers.", "The research history and Kickstarter response show this is more than a design trend."], _c: "MQ==", _e: _b("Separate the maturity of the principle from the newness of the product.") }
  ],
  6: [
    { q: "When does production begin for a distributor order?", opts: ["Once Levitask confirms the order and reserves a production slot.", "Once the Proforma Invoice has been issued and accepted by the distributor.", "Upon the receipt of initial deposit and agreed production timelines.", "Once the distributor signs the purchase order and confirms the requested delivery window."], _c: "Mg==", _e: _b("Distributors must understand that lead times start from confirmed production, not from the first enquiry.") },
    { q: "What are the standard production cycles in the distributor order guide?", opts: ["First orders: 45 days; repeat orders: 60 days.", "50-day production cycle.", "First orders: 60 days; repeat orders depend on the next available factory slot.", "First orders and repeat orders both use the same 60-day cycle unless expedited."], _c: "MQ==", _e: _b("Distributors need realistic timelines before committing delivery dates to customers.") },
    { q: "How should a distributor calculate expected total delivery time?", opts: ["Production lead time plus the requested delivery window from the PO.", "Transit time plus customs clearance, because production is already included in the confirmed delivery date.", "Production lead time plus transit time, with allowance for customs, port congestion, holidays, and other possible delays.", "The production cycle plus the fastest published sea-freight estimate."], _c: "Mg==", _e: _b("Delivery promises should include both production and shipping reality.") },
    { q: "What should distributors say when asked exactly when risk transfers during shipping?", opts: ["Risk usually transfers when the goods leave the factory, but confirm the agreement.", "Risk transfer depends on the Incoterms agreed in the distributor agreement.", "Risk transfer is handled by the freight forwarder, not by the distributor agreement.", "Risk transfer depends on the final customer's delivery terms."], _c: "MQ==", _e: _b("Incoterms and market-specific agreements determine responsibility; distributors should not improvise legal terms.") },
    { q: "How should sea-freight transit estimates be communicated?", opts: ["As planning ranges that can be used as customer-facing delivery commitments once production starts.", "As guidance only, because carrier routing, port congestion, customs, and final destination can change actual timing.", "As standard lead times that normally do not need further review unless the order is urgent.", "As estimates that should be confirmed only after the customer has paid for freight."], _c: "MQ==", _e: _b("Clear expectation-setting prevents avoidable delivery disputes.") },
    { q: "What should the distributor do if inventory arrives with possible transit damage?", opts: ["Document the issue and report it after the full shipment has been inspected.", "Report it to Levitask immediately upon delivery.", "Separate the affected cartons and wait for customer claims before escalating.", "Note it in the distributor's internal records and handle it under the return policy if needed."], _c: "MQ==", _e: _b("Immediate reporting protects the distributor, Levitask, and the end customer.") },

function getQuizQuestions(moduleId) {
  const pool = QUESTION_BANK[moduleId] || [];
  return shuffleArray(pool).slice(0, 5);
}

function buildCertExam() {
  function proportional(poolSizes, total) {
    const entries = Object.entries(poolSizes);
    const poolTotal = Object.values(poolSizes).reduce((a, b) => a + b, 0);
    const floors = {}, rems = [];
    let floorSum = 0;
    for (const [mod, size] of entries) {
      const exact = (size / poolTotal) * total;
      const floor = Math.floor(exact);
      floors[mod] = floor;
      floorSum += floor;
      rems.push({ mod, rem: exact - floor });
    }
    rems.sort((a, b) => b.rem - a.rem);
    for (let i = 0; i < total - floorSum; i++) floors[rems[i].mod]++;
    return floors;
  }
  const g1 = proportional({ 1: 20, 2: 20, 3: 14 }, 20);
  const g2 = proportional({ 4: 20, 5: 13, 6: 18, 7: 20 }, 30);
  const qs = [];
  for (const [mod, count] of Object.entries(g1)) {
    qs.push(...shuffleArray(QUESTION_BANK[parseInt(mod)]).slice(0, count));
  }
  for (const [mod, count] of Object.entries(g2)) {
    qs.push(...shuffleArray(QUESTION_BANK[parseInt(mod)]).slice(0, count));
  }
  return shuffleArray(qs);
}

let examState = {
  questions: [],
  answers: {},
  score: 0,
  passed: false,
  done: false,
  timeLeft: 3600
};

let certTimer = null;

function startCertTimer() {
  clearCertTimer();
  certTimer = setInterval(() => {
    examState.timeLeft = Math.max(0, examState.timeLeft - 1);
    const el = document.getElementById('cert-timer');
    if (el) {
      const m = Math.floor(examState.timeLeft / 60);
      const s = examState.timeLeft % 60;
      el.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (examState.timeLeft <= 300) el.style.color = 'var(--accent)';
    }
    if (examState.timeLeft <= 0) {
      clearCertTimer();
      submitExam();
    }
  }, 1000);
}

function clearCertTimer() {
  if (certTimer) { clearInterval(certTimer); certTimer = null; }
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startExam() {
  examState = { questions: buildCertExam(), answers: {}, score: 0, passed: false, done: false, timeLeft: 3600 };
  state.view = 'cert-exam';
  render();
  startCertTimer();
}

function submitExam() {
  clearCertTimer();
  let score = 0;
  examState.questions.forEach((q, qi) => {
    const selected = (examState.answers[qi] || []);
    const correctIdx = parseInt(_d(q._c));
    if (selected.length === 1 && selected[0] === correctIdx) score++;
  });
  examState.score = score;
  const totalQuestions = examState.questions.length;
  const passThreshold = Math.ceil(totalQuestions * 0.9);
  examState.passed = score >= passThreshold;
  examState.done = true;
  state.view = 'cert-result';
  render();
}

function updateAnsweredCount() {
  const el = document.getElementById('cert-answered-count');
  if (!el) return;
  const count = Object.keys(examState.answers).filter(k => (examState.answers[k] || []).length > 0).length;
  el.textContent = `${count} of ${examState.questions.length} questions answered`;
}

function updateCertOption(qi, oi) {
  const block = document.querySelector(`[data-qi="${qi}"]`);
  if (!block) return;
  const selected = examState.answers[qi] || [];
  block.querySelectorAll('.cert-option').forEach((optEl, i) => {
    const isSel = selected.includes(i);
    optEl.classList.toggle('selected', isSel);
    const marker = optEl.querySelector('.cert-option-marker');
    if (marker) {
      marker.style.borderColor = isSel ? 'var(--accent)' : '';
      marker.style.background = isSel ? 'var(--accent)' : '';
    }
  });
  updateAnsweredCount();
}

function getCertId() {
  let id = localStorage.getItem('levitask_cert_id');
  if (!id) {
    const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let rand = '';
    for (let i = 0; i < 6; i++) rand += chars[Math.floor(Math.random() * chars.length)];
    id = `LVT-${new Date().getFullYear()}-${rand}`;
    localStorage.setItem('levitask_cert_id', id);
  }
  return id;
}

const STORAGE_KEY = 'lv_training_progress';

let state = {
  view: 'home',       // 'home' | 'module-overview' | 'section' | 'quiz' | 'recap' | 'cert-intro' | 'cert-exam' | 'cert-result' | 'cert'
  module: 1,
  section: 1
};

let quizState = { currentQ: 0, selected: null, confirmed: false, score: 0, answers: [], done: false };

function initProgress() {
  const mp = {};
  for (let i = 1; i <= 7; i++) {
    mp[i] = { status: 'not-started', sectionsCompleted: [], quizScore: null };
  }
  return { moduleProgress: mp, currentModule: 1, currentSection: 1 };
}

function loadProgress() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return initProgress();
    const parsed = JSON.parse(raw);
    for (let i = 1; i <= 7; i++) {
      if (!parsed.moduleProgress[i]) {
        parsed.moduleProgress[i] = { status: 'not-started', sectionsCompleted: [], quizScore: null };
      }
    }
    return parsed;
  } catch (e) {
    return initProgress();
  }
}

function saveProgress(progress) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch (e) {}
}

let progress = loadProgress();

// ─── HELPERS ─────────────────────────────────────────────────────────────────

function isModuleUnlocked(moduleId) {
  if (moduleId === 1) return true;
  return progress.moduleProgress[moduleId - 1].status === 'completed';
}

function totalSectionsCompleted() {
  let total = 0;
  for (let i = 1; i <= 7; i++) {
    total += (progress.moduleProgress[i].sectionsCompleted || []).length;
  }
  return total;
}

function overallPct() {
  return Math.round((totalSectionsCompleted() / 21) * 100);
}

function hasStarted() {
  for (let i = 1; i <= 7; i++) {
    if (progress.moduleProgress[i].status !== 'not-started') return true;
  }
  return false;
}

function currentActiveModule() {
  for (let i = 1; i <= 7; i++) {
    if (progress.moduleProgress[i].status === 'in-progress') return i;
  }
  for (let i = 1; i <= 7; i++) {
    if (isModuleUnlocked(i) && progress.moduleProgress[i].status === 'not-started') return i;
  }
  return 1;
}

function firstIncompleteSection(moduleId) {
  const mp = progress.moduleProgress[moduleId];
  for (let s = 1; s <= 3; s++) {
    if (!(mp.sectionsCompleted || []).includes(s)) return s;
  }
  return 1;
}

function moduleStatusClass(moduleId) {
  const s = progress.moduleProgress[moduleId].status;
  if (!isModuleUnlocked(moduleId)) return 'm-locked';
  if (s === 'completed') return 'm-done';
  if (s === 'in-progress') return 'm-active';
  return '';
}

function moduleBadgeHtml(moduleId) {
  const s = progress.moduleProgress[moduleId].status;
  if (!isModuleUnlocked(moduleId)) return '<span class="mc-badge b-locked">Locked</span>';
  if (s === 'completed') return '<span class="mc-badge b-done">✓ Completed</span>';
  if (s === 'in-progress') return '<span class="mc-badge b-progress">In progress</span>';
  return '<span class="mc-badge b-locked">Not started</span>';
}

function sectionStatusClass(moduleId, sectionId) {
  if (!isModuleUnlocked(moduleId)) return 'sc-locked';
  const completed = progress.moduleProgress[moduleId].sectionsCompleted || [];
  if (completed.includes(sectionId)) return 'sc-done';
  // unlock only if previous section completed (or it's section 1)
  if (sectionId === 1) return 'sc-active';
  if (completed.includes(sectionId - 1)) return 'sc-active';
  return 'sc-locked';
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────

function goHome() {
  state.view = 'home';
  render();
}

function goModuleOverview(moduleId) {
  if (!isModuleUnlocked(moduleId)) return;
  state.view = 'module-overview';
  state.module = moduleId;
  progress.currentModule = moduleId;
  saveProgress(progress);
  render();
}

function goSection(moduleId, sectionId) {
  if (!isModuleUnlocked(moduleId)) return;
  state.view = 'section';
  state.module = moduleId;
  state.section = sectionId;
  progress.currentModule = moduleId;
  progress.currentSection = sectionId;
  // Mark module as in-progress if not already started/completed
  if (progress.moduleProgress[moduleId].status === 'not-started') {
    progress.moduleProgress[moduleId].status = 'in-progress';
  }
  saveProgress(progress);
  render();
}

function startModule(moduleId) {
  const s = firstIncompleteSection(moduleId);
  goSection(moduleId, s);
}

    case 'cert-result':     el.innerHTML = renderCertResult(); break;
    case 'cert':            el.innerHTML = renderCert(); break;
  }
  app.appendChild(el);
  attachListeners();
  if (state.view === 'cert-exam') startCertTimer();
}

function updateTopbar() {
  const el = document.getElementById('topbar-right');
  if (state.view === 'home') {
    if (hasStarted()) {
      const m = currentActiveModule();
      const mp = progress.moduleProgress[m];
      const statusText = mp.status === 'completed' ? 'Completed' : 'In progress';
      el.textContent = `Module ${m} of 7 · ${statusText}`;
    } else {
      el.textContent = '';
    }
  } else if (state.view === 'module-overview') {
    el.textContent = `Training › Module ${state.module}`;
  } else if (state.view === 'section') {
    el.textContent = `Training › Module ${state.module} › Section ${state.module}.${state.section}`;
  } else if (state.view === 'quiz') {
    el.textContent = `Training › Module ${state.module} › Quiz`;
  } else if (state.view === 'recap') {
    el.textContent = `Training › Module ${state.module} › Recap`;
  } else if (state.view === 'cert-intro') {
    el.textContent = 'Certification › Overview';
  } else if (state.view === 'cert-exam') {
    el.textContent = 'Certification › Exam';
  } else if (state.view === 'cert-result') {
    el.textContent = 'Certification › Results';
  } else if (state.view === 'cert') {
    el.textContent = 'Certification › Certificate';
  }
}
